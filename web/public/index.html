<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 JS Secret Scanner Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5em;
      background: linear-gradient(90deg, #00d4ff, #7b2cbf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .stat-box {
      background: rgba(255,255,255,0.05);
      padding: 15px 30px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .stat-number {
      font-size: 2em;
      font-weight: bold;
      color: #00d4ff;
    }
    
    .stat-label {
      color: #888;
      font-size: 0.9em;
    }
    
    #findings-list {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .finding-card {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      border-left: 4px solid #00d4ff;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    .finding-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .file-path {
      color: #888;
      font-size: 0.85em;
      word-break: break-all;
    }
    
    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75em;
      font-weight: bold;
      text-transform: uppercase;
    }
    
    .badge-critical {
      background: #ff4444;
      color: #fff;
    }
    
    .badge-high {
      background: #ff8800;
      color: #fff;
    }
    
    .badge-medium {
      background: #ffcc00;
      color: #000;
    }
    
    .badge-low {
      background: #888;
      color: #fff;
    }
    
    .badge-category {
      background: #7b2cbf;
      color: #fff;
    }
    
    .secrets-list {
      margin-top: 15px;
    }
    
    .secret-item {
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    
    .secret-type {
      color: #00d4ff;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .secret-value {
      font-family: 'Courier New', monospace;
      background: rgba(0,0,0,0.5);
      padding: 8px;
      border-radius: 5px;
      word-break: break-all;
      color: #ff6b6b;
      font-size: 0.9em;
    }
    
    .secret-meta {
      display: flex;
      gap: 15px;
      margin-top: 8px;
      font-size: 0.8em;
      color: #888;
      flex-wrap: wrap;
    }
    
    .secret-context {
      margin-top: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 5px;
      font-size: 0.85em;
      color: #aaa;
      font-family: 'Courier New', monospace;
      word-break: break-all;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    
    .empty-state h2 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    
    .connection-status {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: bold;
    }
    
    .status-connected {
      background: #00ff88;
      color: #000;
    }
    
    .status-disconnected {
      background: #ff4444;
      color: #fff;
    }
    
    .status-connecting {
      background: #ffcc00;
      color: #000;
    }
  </style>
</head>
<body>
  <div id="connection-status" class="connection-status status-connecting">Connecting...</div>
  
  <h1>🔍 JS Secret Scanner</h1>
  <p class="subtitle">Real-time secret detection dashboard</p>
  
  <div class="stats">
    <div class="stat-box">
      <div class="stat-number" id="total-files">0</div>
      <div class="stat-label">Files Scanned</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="total-secrets">0</div>
      <div class="stat-label">Secrets Found</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="critical-count">0</div>
      <div class="stat-label">Critical</div>
    </div>
  </div>
  
  <div id="findings-list">
    <div class="empty-state">
      <h2>🔎</h2>
      <p>Waiting for scan results...</p>
      <p style="font-size: 0.9em; margin-top: 10px;">Run: <code>node bin/recon.js &lt;target&gt;</code></p>
    </div>
  </div>

  <script>
    const socket = io();
    const findingsList = document.getElementById('findings-list');
    const statusBadge = document.getElementById('connection-status');
    
    let totalFiles = 0;
    let totalSecrets = 0;
    let criticalCount = 0;
    
    // Connection status
    socket.on('connect', () => {
      statusBadge.textContent = 'Connected';
      statusBadge.className = 'connection-status status-connected';
      console.log('✅ Connected to scanner');
    });
    
    socket.on('disconnect', () => {
      statusBadge.textContent = 'Disconnected';
      statusBadge.className = 'connection-status status-disconnected';
      console.log('❌ Disconnected from scanner');
    });
    
    socket.on('connect_error', (err) => {
      statusBadge.textContent = 'Connection Error';
      statusBadge.className = 'connection-status status-disconnected';
      console.error('Connection error:', err);
    });
    
    // Handle historical data on initial load
    socket.on('history', (history) => {
      console.log(`📚 Received ${history.length} historical findings`);
      findingsList.innerHTML = '';
      history.forEach(data => addFinding(data));
    });
    
    // Handle new findings
    socket.on('update', (data) => {
      console.log('📡 New finding received:', data);
      addFinding(data);
    });
    
    function addFinding(data) {
      // Remove empty state if present
      const emptyState = findingsList.querySelector('.empty-state');
      if (emptyState) {
        emptyState.remove();
      }
      
      totalFiles++;
      document.getElementById('total-files').textContent = totalFiles;
      
      if (!data.results || data.results.length === 0) return;
      
      const card = document.createElement('div');
      card.className = 'finding-card';
      
      // Count secrets
      const secretCount = data.results.length;
      totalSecrets += secretCount;
      document.getElementById('total-secrets').textContent = totalSecrets;
      
      // Count critical
      const criticalInThis = data.results.filter(r => r.confidence === 'CRITICAL').length;
      criticalCount += criticalInThis;
      document.getElementById('critical-count').textContent = criticalCount;
      
      // Determine highest confidence for border color
      const hasCritical = data.results.some(r => r.confidence === 'CRITICAL');
      const hasHigh = data.results.some(r => r.confidence === 'HIGH');
      if (hasCritical) card.style.borderLeftColor = '#ff4444';
      else if (hasHigh) card.style.borderLeftColor = '#ff8800';
      
      // Build secrets HTML
      const secretsHtml = data.results.map(secret => {
        const confidenceClass = `badge-${secret.confidence?.toLowerCase() || 'low'}`;
        const category = secret.category || 'unknown';
        
        return `
          <div class="secret-item">
            <div class="secret-type">${escapeHtml(secret.type)}</div>
            <div class="secret-value">${escapeHtml(secret.value)}</div>
            <div class="secret-meta">
              <span class="badge ${confidenceClass}">${secret.confidence || 'LOW'}</span>
              <span class="badge badge-category">${category}</span>
              ${secret.entropy ? `<span>Entropy: ${secret.entropy}</span>` : ''}
              ${secret.line ? `<span>Line: ${secret.line}</span>` : ''}
            </div>
            ${secret.context ? `<div class="secret-context">${escapeHtml(secret.context)}</div>` : ''}
          </div>
        `;
      }).join('');
      
      card.innerHTML = `
        <div class="finding-header">
          <div class="file-path">${escapeHtml(data.file)}</div>
          <div class="badges">
            <span class="badge badge-high">${secretCount} SECRETS</span>
          </div>
        </div>
        <div class="secrets-list">
          ${secretsHtml}
        </div>
      `;
      
      findingsList.insertBefore(card, findingsList.firstChild);
    }
    
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
